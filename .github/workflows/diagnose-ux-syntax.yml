name: Diagnose UX syntax
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-ux-syntax.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          echo "=== site/full/ux.v1.1.js ==="
          node --check site/full/ux.v1.1.js
          echo "=== src/ux.v1.1.js ==="
          node --check src/ux.v1.1.js
          echo "=== app ==="
          node --check site/full/app.full.js
