name: JQA live verification

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/jqa-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP verify GitHub Pages paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jiakwonau-sudo.github.io/SEIN"
          check() {
            path="$1"
            marker="$2"
            echo "Checking $BASE$path"
            body="$(curl -fsSL --retry 12 --retry-delay 2 "$BASE$path")"
            echo "$body" | grep -F "$marker" >/dev/null
            echo "PASS $path"
          }
          check "/" "SEIN 통합 관리 시스템"
          check "/original/" "세인코퍼레이션 내부 관리 시스템"
          check "/full/" "세인코퍼레이션 통합 관리 시스템"
          check "/v1-0-full/" "세인코퍼레이션 통합 관리 시스템"
          check "/v1-1-full/" "세인코퍼레이션 통합 관리 시스템"\n          check "/v1-1-1-full/" "세인코퍼레이션 통합 관리 시스템"
          curl -fsSL --retry 12 --retry-delay 2 "$BASE/full/app.full.js" | grep -F "sein.full.v1.data" >/dev/null
          curl -fsSL --retry 12 --retry-delay 2 "$BASE/full/app.full.css" | grep -F "login-gate" >/dev/null
          echo "PASS assets"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium

      - name: Browser JQA
        shell: bash
        run: |
          cat > jqa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror', e=>errors.push('pageerror: '+e.message));
            page.on('console', m=>{ if(m.type()==='error') errors.push('console: '+m.text()); });
            const base='https://jiakwonau-sudo.github.io/SEIN';

            let resp=await page.goto(base+'/full/',{waitUntil:'networkidle'});
            assert(resp && resp.ok(),'FULL page HTTP failed');
            await page.locator('#loginBtn').click();
            await page.waitForSelector('#loginGate',{state:'detached'});
            console.log('PASS login');

            await page.locator('[data-page="goods"]:visible').first().click();
            await page.waitForSelector('#newEquip');
            await page.locator('#newEquip').click();
            await page.locator('#efModel').fill('JQA TEST PRESS');
            await page.locator('#efNo').fill('JQA-001');
            await page.locator('#efSave').click();
            await page.waitForTimeout(250);
            assert((await page.locator('body').innerText()).includes('JQA TEST PRESS'),'equipment create failed');
            console.log('PASS equipment create');
            await page.waitForSelector('.ux-next');
            assert((await page.locator('.ux-next').innerText()).includes('다음 행동'),'UX next action missing');
            console.log('PASS UX next action');
            await page.locator('[data-next-close]').click();

            await page.locator('[data-page="customer"]:visible').first().click();
            await page.waitForSelector('#newCustomer');
            await page.locator('#newCustomer').click();
            await page.locator('#cfCo').fill('JQA 고객사');
            await page.locator('#cfP').fill('테스터');
            await page.locator('#cfMail').fill('jqa@example.com');
            await page.locator('#cfSave').click();
            await page.waitForTimeout(250);
            assert((await page.locator('body').innerText()).includes('JQA 고객사'),'customer create failed');
            console.log('PASS customer create');

            await page.locator('[data-page="sales"]:visible').first().click();
            await page.waitForSelector('#newDeal');
            await page.locator('#newDeal').click();
            await page.locator('#dName').fill('JQA 영업건');
            await page.locator('.dealEq').first().check();
            const saveDeal = page.locator('#dSave');
            if(await saveDeal.count()) {
              await saveDeal.click();
            } else {
              const primary = page.locator('#modal .btn.primary').last();
              await primary.click();
            }
            await page.waitForTimeout(250);
            assert((await page.locator('body').innerText()).includes('JQA 영업건'),'sales create failed');
            console.log('PASS sales create');

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto(base+'/full/',{waitUntil:'networkidle'});
            await mobile.locator('#loginBtn').click();
            await mobile.waitForSelector('.mobile-bottom');
            assert(await mobile.locator('.mobile-bottom').isVisible(),'mobile bottom nav missing');
            console.log('PASS mobile nav');

            if(errors.length) {
              console.log(errors.join('\n'));
              throw new Error('Browser console/page errors detected: '+errors.length);
            }
            console.log('PASS no console errors');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node jqa.js


# verify latest v1.1.1
