name: Toggle Freeze Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/toggle-freeze-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click collapse toggles and check responsiveness
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const url='https://jiakwonau-sudo.github.io/SEIN/full/?toggleSmoke=v143';
            const resp=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            if(!resp || resp.status()!==200)throw new Error('FULL HTTP '+(resp&&resp.status()));
            await page.locator('#loginBtn').click();
            await page.waitForSelector('#loginGate',{state:'detached'});
            await page.waitForTimeout(700);

            const toggles=page.locator('button.ux142-collapse-btn:visible,button[data-flow-toggle]:visible,button[data-v142-dashboard]:visible');
            const count=await toggles.count();
            if(count<3)throw new Error('Expected collapse toggles, got '+count);

            const tested=Math.min(count,5);
            for(let i=0;i<tested;i++){
              const b=toggles.nth(i);
              const before=(await b.textContent()||'').trim();
              await b.click({timeout:3000});
              await page.waitForTimeout(120);
              const after=(await b.textContent()||'').trim();
              if(before===after)throw new Error('Toggle label did not change at index '+i+' ('+before+')');
              await page.evaluate(()=>document.body && document.body.offsetHeight);
              await b.click({timeout:3000});
              await page.waitForTimeout(120);
              const back=(await b.textContent()||'').trim();
              if(back!==before)throw new Error('Toggle did not restore at index '+i+' '+before+' -> '+after+' -> '+back);
            }

            const q=page.locator('#quickFind');
            await q.click({timeout:3000});
            await page.waitForSelector('#gSearch',{timeout:3000});
            await page.keyboard.press('Escape');
            await page.waitForTimeout(150);
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('PASS toggle-count='+count+' tested='+tested+' no-page-errors');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
