name: JQA E2E v1.1 audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/jqa-e2e-v1-1.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run JQA browser audit
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://jiakwonau-sudo.github.io/SEIN/full/';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            const pass=(n)=>console.log('PASS',n);
            const fail=(n,e)=>{console.log('FAIL',n,e||'');process.exitCode=1};
            try{
              let r=await page.goto(base,{waitUntil:'networkidle'});
              if(r?.status()===200) pass('HTTP full 200'); else fail('HTTP full',r?.status());
              if(await page.locator('#loginGate').count()) pass('login gate'); else fail('login gate');
              await page.locator('#loginBtn').click();
              await page.waitForTimeout(300);
              if(!(await page.locator('#loginGate').count())) pass('login'); else fail('login');

              const body=(await page.locator('body').innerText());
              if(body.includes('상품 관리')||body.includes('대시보드')) pass('main app rendered'); else fail('main app rendered');

              // Equipment
              const eqBtn=page.getByRole('button',{name:/설비 등록/}).first();
              if(await eqBtn.count()){
                await eqBtn.click();
                await page.locator('#efModel').fill('JQA TEST PRESS');
                await page.locator('#efNo').fill('JQA-001');
                await page.locator('#efStatus').selectOption({label:'재고'});
                await page.locator('#efSave').click();
                await page.waitForTimeout(250);
                if((await page.locator('body').innerText()).includes('JQA TEST PRESS')) pass('equipment create'); else fail('equipment create');
              } else fail('equipment create button');

              // Customer page
              const custNav=page.getByRole('button',{name:/고객 관리/}).first();
              if(await custNav.count()){
                await custNav.click(); await page.waitForTimeout(200);
                const add=page.getByRole('button',{name:/고객 등록/}).first();
                if(await add.count()){
                  await add.click();
                  await page.locator('#cfCo').fill('JQA 고객사');
                  await page.locator('#cfP').fill('검수담당');
                  await page.locator('#cfMail').fill('jqa@example.com');
                  await page.locator('#cfSave').click();
                  await page.waitForTimeout(200);
                  if((await page.locator('body').innerText()).includes('JQA 고객사')) pass('customer create'); else fail('customer create');
                } else fail('customer add button');
              } else fail('customer nav');

              // Global search UI
              if(await page.locator('#quickFind').count()){await page.locator('#quickFind').click(); if(await page.locator('#gSearch').count()) pass('global search'); else fail('global search'); await page.keyboard.press('Escape');}
              else fail('global search button');

              // Mobile bottom nav
              await page.setViewportSize({width:390,height:844}); await page.waitForTimeout(150);
              if(await page.locator('.mobile-bottom').count()) pass('mobile bottom nav'); else fail('mobile bottom nav');

              // Explicit UX promise: next action after save
              const html=await page.content();
              if(/다음 행동|next-action|추천 행동/i.test(html)) pass('next action UX'); else fail('next action UX','not implemented');

              if(errors.length){console.log('BROWSER_ERRORS',JSON.stringify(errors)); fail('console/page errors',errors.join(' | '));}
              else pass('console/page errors');
            }catch(e){console.error(e);process.exitCode=1}
            await browser.close();
          })();
          NODE
