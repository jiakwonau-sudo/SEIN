name: JQA E2E v1.1.1 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/jqa-e2e-v1-1-1.yml"
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Full live JQA
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const ROOT='https://jiakwonau-sudo.github.io/SEIN/';
            const urls=['','original/','full/','v1-0-full/','v1-1-full/','v1-1-1-full/'];
            for(const p of urls){
              const r=await fetch(ROOT+p,{redirect:'follow'});
              console.log(r.ok?'PASS':'FAIL','HTTP',p||'root',r.status);
              if(!r.ok)process.exitCode=1;
            }
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            const pass=n=>console.log('PASS',n);
            const fail=(n,e='')=>{console.log('FAIL',n,e);process.exitCode=1};
            try{
              await page.goto(ROOT+'full/',{waitUntil:'networkidle'});
              if(await page.locator('#loginGate').count())pass('login gate');else fail('login gate');
              await page.locator('#loginBtn').click(); await page.waitForTimeout(250);
              if(!(await page.locator('#loginGate').count()))pass('login');else fail('login');

              // Equipment CRUD
              await page.locator('[data-page="goods"]:visible').first().click();
              await page.waitForSelector('#newEquip');
              await page.locator('#newEquip').click();
              await page.locator('#efModel').fill('JQA PRESS 111');
              await page.locator('#efNo').fill('JQA-111');
              await page.locator('#efSave').click(); await page.waitForTimeout(300);
              if((await page.locator('body').innerText()).includes('JQA PRESS 111'))pass('equipment create');else fail('equipment create');
              if(await page.locator('.ux-next').count())pass('equipment next-action');else fail('equipment next-action');

              // Customer CRUD
              await page.getByRole('button',{name:/고객 관리/}).first().click(); await page.waitForTimeout(200);
              await page.getByRole('button',{name:/고객 등록/}).first().click();
              await page.locator('#cfCo').fill('JQA 고객사 111');
              await page.locator('#cfP').fill('QA 담당');
              await page.locator('#cfMail').fill('qa111@example.com');
              await page.locator('#cfSave').click(); await page.waitForTimeout(300);
              if((await page.locator('body').innerText()).includes('JQA 고객사 111'))pass('customer create');else fail('customer create');
              if(await page.locator('.ux-next').count())pass('customer next-action');else fail('customer next-action');
              await page.locator('[data-next-close]').click().catch(()=>{});

              // Sales create with equipment
              await page.getByRole('button',{name:/영업 관리/}).first().click(); await page.waitForTimeout(200);
              await page.getByRole('button',{name:/영업 건 생성/}).first().click();
              await page.locator('#dName').fill('JQA 영업 111');
              await page.locator('.dealEq').first().check();
              await page.locator('#dPlanned').fill('12345678');
              await page.locator('#dSave').click(); await page.waitForTimeout(300);
              if((await page.locator('body').innerText()).includes('JQA 영업 111'))pass('sales create');else fail('sales create');
              if(await page.locator('.ux-next').count())pass('sales next-action');else fail('sales next-action');
              await page.locator('[data-next-close]').click().catch(()=>{});

              // Calendar CRUD
              const cal=page.getByRole('button',{name:'캘린더'}).first();
              await cal.click(); await page.waitForTimeout(200);
              await page.getByRole('button',{name:/일정 등록/}).first().click();
              await page.locator('#evTitle').fill('JQA 일정 111');
              await page.locator('#evDate').fill('2026-09-28');
              await page.locator('#evSave').click(); await page.waitForTimeout(300);
              if((await page.locator('body').innerText()).includes('JQA 일정 111'))pass('calendar create');else fail('calendar create');

              // Return used category then account
              const used=page.getByRole('button',{name:'중고 설비'}).first();
              await used.click(); await page.waitForTimeout(200);
              const acct=page.getByRole('button',{name:/회계 관리/}).first();
              if(await acct.count()){await acct.click();await page.waitForTimeout(200); if((await page.locator('body').innerText()).includes('회계 관리'))pass('account page');else fail('account page');}
              else fail('account nav');

              // Ops / integrations
              const ops=page.getByRole('button',{name:/운영 도구/}).first();
              if(await ops.count()){await ops.click();await page.waitForTimeout(200);const txt=await page.locator('body').innerText();for(const s of ['Gmail 발송 큐','고객 Excel/CSV Import','Legacy 이관 Pilot','전체 백업·복구']){if(txt.includes(s))pass('ops '+s);else fail('ops '+s);}}
              else fail('ops nav');

              // Global search
              if(await page.locator('#quickFind').count()){await page.locator('#quickFind').click();if(await page.locator('#gSearch').count())pass('global search');else fail('global search');await page.keyboard.press('Escape')}else fail('global search');

              // Mobile
              await page.setViewportSize({width:390,height:844});await page.waitForTimeout(180);
              if(await page.locator('.mobile-bottom').count())pass('mobile bottom nav');else fail('mobile bottom nav');

              if(errors.length)fail('console/page errors',errors.join(' | '));else pass('console/page errors');
            }catch(e){console.error('UNCAUGHT',e);process.exitCode=1}
            await browser.close();
          })();
          NODE
