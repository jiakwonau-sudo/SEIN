name: Verify SEIN GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check published URLs
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            marker="$2"
            echo "=== $url ==="
            body="$(mktemp)"
            code="$(curl -L -sS --retry 8 --retry-delay 2 -o "$body" -w '%{http_code}' "$url")"
            echo "HTTP=$code"
            test "$code" = "200"
            grep -F "$marker" "$body" >/dev/null
          }
          check "https://jiakwonau-sudo.github.io/SEIN/" "SEIN 통합 관리 시스템"
          check "https://jiakwonau-sudo.github.io/SEIN/original/" "세인코퍼레이션 내부 관리 시스템"
          check "https://jiakwonau-sudo.github.io/SEIN/full/" "FULL v1.2.0"
          check "https://jiakwonau-sudo.github.io/SEIN/v1-2-0-full/" "FULL v1.2.0"
