name: Verify SEIN GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source preview JavaScript syntax
        shell: bash
        run: |
          node --check site/v1-6-0-source/app.js

      - name: Check published SEIN versions
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            marker="$2"
            tmp="$(mktemp)"
            code="$(curl -L -sS --retry 40 --retry-delay 5 --retry-all-errors -o "$tmp" -w '%{http_code}' "$url")"
            echo "$url HTTP=$code"
            test "$code" = "200"
            grep -F "$marker" "$tmp" >/dev/null
          }

          BASE="https://jiakwonau-sudo.github.io/SEIN"
          check "$BASE/" "v1.6.0 SOURCE PARITY"
          check "$BASE/full/" "FULL v1.5.0"
          check "$BASE/v1-5-0-full/" "FULL v1.5.0"
          check "$BASE/v1-6-0-source/" "SOURCE PARITY"
          check "$BASE/v1-6-0-source/app.js?v=160" "설비 현황과 영업 실적을 한눈에 확인하세요."
          check "$BASE/v1-6-0-source/app.js?v=160" "판매 수익 통계"
          check "$BASE/v1-6-0-source/app.js?v=160" "오늘의 일정"
          check "$BASE/v1-6-0-source/private-data.json?v=160" "PBKDF2-SHA256/AES-256-GCM+gzip"

          {
            echo "# SEIN Pages Verification"
            echo
            echo "- Status: PASS"
            echo "- Current release: v1.5.0-full"
            echo "- Source parity preview: v1.6.0-source-parity"
            echo "- Commit: $GITHUB_SHA"
            echo "- Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Current: https://jiakwonau-sudo.github.io/SEIN/full/"
            echo "- Source parity: https://jiakwonau-sudo.github.io/SEIN/v1-6-0-source/"
          } > .github/pages-status.md

      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-status.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Pages verification"
          git push
