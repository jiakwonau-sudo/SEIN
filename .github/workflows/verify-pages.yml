name: Verify SEIN GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check v1.4.2 published URLs
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            marker="$2"
            tmp="$(mktemp)"
            code="$(curl -L -sS --retry 8 --retry-delay 2 -o "$tmp" -w '%{http_code}' "$url")"
            echo "$url HTTP=$code"
            test "$code" = "200"
            grep -F "$marker" "$tmp" >/dev/null
          }
          BASE="https://jiakwonau-sudo.github.io/SEIN"
          check "$BASE/full/" "FULL v1.4.2"
          check "$BASE/v1-4-2-full/" "FULL v1.4.2"
          check "$BASE/full/collapse.v1.4.2.css" "real collapse"
          check "$BASE/full/collapse.v1.4.2.js" "true section collapse"
