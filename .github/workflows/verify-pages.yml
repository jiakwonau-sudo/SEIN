name: Verify SEIN GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "scripts/verify-customer360-security.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/v1-6-0-source/app.js
          node --check site/v1-7-0-crud/app.js
          node --check site/full/customer.v1.5.0.js

      - name: Verify Customer 360 security boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e site/full/data/customer360
          node scripts/verify-customer360-security.mjs

      - name: Check published SEIN versions
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            marker="$2"
            tmp="$(mktemp)"
            code="$(curl -L -sS --retry 40 --retry-delay 5 --retry-all-errors -o "$tmp" -w '%{http_code}' "$url")"
            echo "$url HTTP=$code"
            test "$code" = "200"
            grep -F "$marker" "$tmp" >/dev/null
          }

          check_200() {
            url="$1"
            tmp="$(mktemp)"
            code="$(curl -L -sS --retry 40 --retry-delay 5 --retry-all-errors -o "$tmp" -w '%{http_code}' "$url")"
            echo "$url HTTP=$code"
            test "$code" = "200"
            test -s "$tmp"
          }

          check_absent() {
            url="$1"
            tmp="$(mktemp)"
            for attempt in $(seq 1 60); do
              code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$url" || true)"
              if [ "$code" = "404" ]; then
                echo "$url HTTP=404 (not published)"
                return 0
              fi
              echo "$url still HTTP=$code; waiting for sanitized Pages deploy ($attempt/60)"
              sleep 5
            done
            echo "ERROR: restricted Customer 360 path remained publicly reachable."
            return 1
          }

          BASE="https://jiakwonau-sudo.github.io/SEIN"
          check "$BASE/" "v1.7.0 CRUD SANDBOX"
          check "$BASE/full/" "FULL v1.5.0"
          check "$BASE/v1-5-0-full/" "FULL v1.5.0"
          check "$BASE/v1-6-0-source/" "SOURCE PARITY"
          check "$BASE/v1-7-0-crud/" "SEIN CRUD Sandbox v1.7.0"
          check "$BASE/v1-7-0-crud/app.js?v=170" "CRUD_SELFTEST_PASS"
          check "$BASE/v1-7-0-crud/app.js?v=170" "JSON 내보내기"
          check_200 "$BASE/v1-7-0-crud/SEIN_v1.7.0_CRUD_SANDBOX.zip"
          check "$BASE/v1-6-0-source/app.js?v=162" "설비 현황과 영업 실적을 한눈에 확인하세요."
          check "$BASE/v1-6-0-source/app.js?v=162" "tileboard"
          check "$BASE/v1-6-0-source/app.js?v=162" "판매 수익 통계"
          check "$BASE/v1-6-0-source/app.js?v=162" "오늘의 일정"
          check "$BASE/v1-6-0-source/private-data.json?v=160" "PBKDF2-SHA256/AES-256-GCM+gzip"
          check_absent "$BASE/full/data/customer360/manifest.json"
          check_absent "$BASE/full/data/customer360/customers-001.json"

          {
            echo "# SEIN Pages Verification"
            echo
            echo "- Status: PASS"
            echo "- Current release: v1.5.0-full"
            echo "- Source parity preview: v1.6.0-source-parity"
            echo "- CRUD sandbox: v1.7.0-crud"
            echo "- CRUD package: published ZIP"
            echo "- Customer 360 public payload: BLOCKED (404 verified)"
            echo "- Customer 360 data mode: local admin import + browser-local storage"
            echo "- Commit: $GITHUB_SHA"
            echo "- Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Current: https://jiakwonau-sudo.github.io/SEIN/full/"
            echo "- Source parity: https://jiakwonau-sudo.github.io/SEIN/v1-6-0-source/"
            echo "- CRUD sandbox: https://jiakwonau-sudo.github.io/SEIN/v1-7-0-crud/"
            echo "- CRUD ZIP: https://jiakwonau-sudo.github.io/SEIN/v1-7-0-crud/SEIN_v1.7.0_CRUD_SANDBOX.zip"
          } > .github/pages-status.md

      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-status.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Pages verification"
          git push
