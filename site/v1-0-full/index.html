<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세인코퍼레이션 통합 관리 시스템 · FULL v1.0</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc;
  --line:#e3e6ea; --line-strong:#cdd3da;
  --ink:#171a1f; --ink-2:#4c5560; --ink-3:#8a939f;
  --brand:#1b4f9c; --brand-2:#2f6fd0; --brand-soft:#eaf1fb;
  --ok:#0f8a53; --ok-soft:#e6f5ed;
  --warn:#b5730a; --warn-soft:#fdf3e2;
  --danger:#c1362f; --danger-soft:#fdeceb;
  --violet:#6b4fbb; --violet-soft:#f0ecfb;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.18);
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--brand-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8cdd4;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── 목업 배너 ───────────────────────── */
.mock-flag{
  background:linear-gradient(90deg,#1b4f9c,#2f6fd0);color:#fff;
  font-size:12px;padding:6px 16px;display:flex;gap:10px;align-items:center;justify-content:center;letter-spacing:-.2px
}
.mock-flag b{font-weight:700}
.mock-flag span{opacity:.8}

/* ── 상단 헤더 ───────────────────────── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:60
}
.topbar-row{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.5px;font-size:15px;white-space:nowrap}
.logo .mark{
  width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800
}
.logo small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.cats{display:flex;align-items:center;gap:4px;margin-left:12px;flex:1;overflow-x:auto}
.cat{
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;border:1px solid transparent;flex-shrink:0
}
.cat:hover{background:var(--surface-2);color:var(--ink)}
.cat.on{background:var(--brand);color:#fff}
.cat.ghost{color:var(--ink-3);border:1px dashed var(--line-strong)}
.cat-add{
  flex-shrink:0;padding:6px 10px;border-radius:999px;border:1px dashed var(--line-strong);
  color:var(--ink-3);font-size:12.5px;font-weight:600
}
.cat-add:hover{border-color:var(--brand-2);color:var(--brand-2)}
.topbar-right{display:flex;align-items:center;gap:10px}
.role-switch{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px
}
.role-switch button{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.role-switch button.on{background:var(--ink);color:#fff}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;border:1px solid #d6e3f7
}

/* ── 레이아웃 ────────────────────────── */
.shell{display:flex;min-height:calc(100vh - 85px)}
.side{
  width:212px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 10px;position:sticky;top:85px;height:calc(100vh - 85px);overflow-y:auto
}
.side-group{margin-bottom:16px}
.side-label{font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.6px;padding:0 10px 6px}
.nav{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--radius);
  font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;margin-bottom:1px
}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav .ic{width:16px;text-align:center;font-size:14px;opacity:.85}
.nav .lock{margin-left:auto;font-size:10px;color:var(--ink-3)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-weight:700}
.nav.on .cnt{background:#d6e3f7;color:var(--brand)}
.main{flex:1;min-width:0;padding:22px 26px 60px}

/* ── 페이지 헤더 ─────────────────────── */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0}
.page-sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── 버튼 ────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);
  font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)
}
.btn:hover{background:var(--surface-2);border-color:#b9c0c9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#173f7d}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.93)}
.btn.danger{color:var(--danger);border-color:#f0c4c1}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px}

/* ── 카드 ────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-size:14px;font-weight:700;margin:0;letter-spacing:-.2px}
.card-body{padding:16px}
.grid{display:grid;gap:14px}

/* ── KPI ─────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-value{font-size:24px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-value .unit{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:5px}
.k-delta.up{color:var(--ok)} .k-delta.down{color:var(--danger)} .k-delta.flat{color:var(--ink-3)}

/* ── 배지 ────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:700;line-height:1.7;white-space:nowrap
}
.b-blue{background:var(--brand-soft);color:var(--brand)}
.b-green{background:var(--ok-soft);color:var(--ok)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-gray{background:#eef0f3;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ── 테이블 ──────────────────────────── */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.2px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap
}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:#fafcff}
table.tbl tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.strong{font-weight:700}
.nowrap{white-space:nowrap}

/* ── 필터 바 ─────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters>span{white-space:nowrap}
.field{
  display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--radius);padding:0 10px;height:34px
}
.field input,.field select{border:none;outline:none;background:none;font-size:13px;min-width:0}
.field input::placeholder{color:var(--ink-3)}
.field .ic{color:var(--ink-3);font-size:13px}
.chip{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex-shrink:0
}
.chip:hover{border-color:var(--brand-2);color:var(--brand-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}

/* ── 설비 카드 그리드 ────────────────── */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.eq:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#c6d5ea}
.eq-thumb{height:132px;position:relative;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.5px}
.eq-thumb .ph{font-size:34px;opacity:.55}
.eq-thumb .tag-stage{position:absolute;left:10px;bottom:10px}
.eq-thumb .tag-cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700}
.eq-body{padding:12px 13px}
.eq-model{font-weight:800;font-size:14px;letter-spacing:-.3px}
.eq-no{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:1px}
.eq-memo{
  margin-top:9px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:7px 9px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.eq-memo .mt{font-size:10.5px;color:var(--ink-3);font-weight:700;display:block;margin-bottom:2px}
.eq-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:6px}
.eq-price{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── 모달 ────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
  backdrop-filter:blur(2px)
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:14px;width:100%;max-width:880px;box-shadow:var(--shadow-lg);
  animation:pop .16s ease-out
}
.modal.wide{max-width:1060px}
.modal.narrow{max-width:520px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px;margin:0}
.modal-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.modal-body{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);border-radius:0 0 14px 14px}
.x{width:30px;height:30px;border-radius:7px;color:var(--ink-3);font-size:17px;display:grid;place-items:center}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* ── 탭 ──────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ── 폼 ──────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.f input,.f select,.f textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-size:13px;
  background:var(--surface);outline:none;width:100%
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,111,208,.12)}
.f .hint{font-size:11px;color:var(--ink-3)}
.f input[readonly]{background:var(--surface-2);color:var(--ink-2)}

/* ── 메모 에디터 ─────────────────────── */
.editor{border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.editor-bar{display:flex;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.eb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-weight:700}
.eb:hover{background:#e9edf2;color:var(--ink)}
.eb.wide{width:auto;padding:0 9px;font-size:12px;gap:4px;display:flex}
.eb-sep{width:1px;height:18px;background:var(--line-strong);margin:0 4px}
.editor-area{
  min-height:230px;padding:14px 16px;outline:none;font-size:13.5px;line-height:1.75;
}
.editor-area:focus{background:#fffefb}
.editor-area h4{margin:14px 0 6px;font-size:13px;color:var(--brand);letter-spacing:-.2px}
.editor-area h4:first-child{margin-top:0}
.editor-area ul{margin:4px 0;padding-left:20px}
.editor-area .spec-line{display:flex;gap:8px;padding:2px 0}
.editor-area .spec-line b{min-width:96px;color:var(--ink-2);font-weight:700;font-size:12.5px}
.drop-zone{
  border-top:1px dashed var(--line-strong);padding:10px 14px;font-size:12px;color:var(--ink-3);
  background:var(--surface-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.drop-zone.hot{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-2)}
.att{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2)
}
.att .sz{color:var(--ink-3);font-weight:500}
.att .rm{color:var(--ink-3);font-size:13px;line-height:1}
.embed{
  border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;
  background:var(--surface-2);margin:8px 0;max-width:400px
}
.embed .thumb{width:88px;height:52px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.embed .t{font-size:12.5px;font-weight:700}
.embed .u{font-size:11px;color:var(--ink-3);word-break:break-all}

/* ── 사진 갤러리 ─────────────────────── */
.stage-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);position:relative}
.ph-card .im{height:96px;display:grid;place-items:center;color:#fff;font-size:22px;opacity:.9}
.ph-card .meta{padding:7px 8px;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:4px}
.ph-card input[type=checkbox]{position:absolute;top:7px;left:7px;width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.dl-note{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid #f3e0bd;border-radius:6px;padding:7px 10px;margin-top:10px}

.lock-note{
  display:flex;gap:10px;align-items:flex-start;background:var(--violet-soft);border:1px solid #ddd4f5;
  border-radius:var(--radius);padding:11px 13px;font-size:12.5px;color:#4a3785;margin-bottom:14px
}
.lock-note b{color:var(--violet)}
.denied{text-align:center;padding:72px 20px;color:var(--ink-3)}
.denied .lk{font-size:40px;margin-bottom:12px;opacity:.5}
.denied h3{margin:0 0 6px;color:var(--ink);font-size:16px}

/* ── 캘린더 ──────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .dh{background:var(--surface-2);font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:96px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px}
.cal .dc.dim{background:var(--surface-2);color:var(--ink-3)}
.cal .dn{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.cal .dc.today .dn{background:var(--brand);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.ev{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 기타 ────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;
  transition:.2s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:80vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty .ic{font-size:36px;opacity:.4;margin-bottom:10px}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--ink-2)}
.split{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.row-red{background:#fef7f6}
.row-gray{background:#f7f8f9;color:var(--ink-3)}
.row-amber{background:#fffbf3}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--brand-2)}
.note-input{width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:9px 11px;font-size:13px;outline:none;resize:vertical;min-height:56px}
.note-input:focus{border-color:var(--brand-2)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 14px}
.tl-item:before{content:"";position:absolute;left:-17px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.tl-item .w{font-size:11px;color:var(--ink-3);font-weight:700}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 2400);
}
function openModal(html, cls){
  const m = $('#modal'); m.className = 'modal ' + (cls||''); m.innerHTML = html;
  $('#overlay').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; }
$('#overlay').addEventListener('mousedown', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function renderCats(){
  $('#cats').innerHTML = CATS.map(c=>
    `<button class="cat ${c.ghost?'ghost':''} ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.name}</button>`
  ).join('') + `<button class="cat-add" id="catAdd">＋ 카테고리</button>`;

  $$('#cats .cat').forEach(b=> b.onclick = ()=>{
    state.cat = b.dataset.cat;
    state.drivePath = [];
    if(state.cat==='calendar'){ state.page='calendar'; }
    else if(state.cat==='asahi'){ state.page='goods'; }
    else if(state.page==='calendar'){ state.page='dash'; }
    render();
  });
  $('#catAdd').onclick = ()=> openModal(`
    <div class="modal-head"><div><h3 class="modal-title">카테고리 추가</h3>
    <div class="modal-sub">신규 사업(예: 세정기, 로봇) 추가 시 중고 설비 / 아사히 세이키와 동일한 폴더 구조로 생성됩니다.</div></div>

function renderSide(){
  const side = $('#side');
  // 아사히 세이키 = 제품 드라이브 전용 카테고리 (좌측 메뉴 없음)
  if(state.cat==='asahi'){
    side.style.display = 'none';
    side.innerHTML = '';
    $('#pillNav').innerHTML = '';
    return;
  }
  side.style.display = '';
  if(state.cat==='calendar'){
    $('#side').innerHTML = `<div class="side-group"><div class="side-label">캘린더</div>
      <button class="nav on"><span class="ic">📅</span>월간 일정</button>
      <button class="nav"><span class="ic">📋</span>선적 일정</button>
      <button class="nav"><span class="ic">🔔</span>알림 설정</button></div>`;
    $('#pillNav').innerHTML = '';
    return;
  }
  let h='';
  NAVS.forEach(g=>{
    const items = g.items.filter(i=> !(i.admin && state.role!=='admin') || true);
    h += `<div class="side-group"><div class="side-label">${g.g}</div>`;
    items.forEach(i=>{
      const drive = state.cat==='asahi' && i.id==='goods';
      const name = drive ? '제품 드라이브' : i.name;
      const ic   = drive ? '🗂' : i.ic;
      const cnt = drive ? totalFiles(DRIVE)
        : {goods:catEquip().length, quote:QUOTES.length, sales:DEALS.length, customer:CUSTOMERS.length}[i.id];
      const lock = i.admin ? `<span class="lock">🔒 대표자</span>` : (cnt!=null?`<span class="cnt">${cnt}</span>`:'');
      h += `<button class="nav ${state.page===i.id?'on':''}" data-page="${i.id}"><span class="ic">${ic}</span>${name}${lock}</button>`;
    });
    h += `</div>`;
  });
  $('#side').innerHTML = h;
  $$('#side .nav[data-page]').forEach(b=> b.onclick = ()=>{ state.page=b.dataset.page; render(); });

  $('#pillNav').innerHTML = NAVS.flatMap(g=>g.items).map(i=>{
    const nm = (state.cat==='asahi' && i.id==='goods') ? '제품 드라이브' : i.name;
    return `<button class="chip ${state.page===i.id?'on':''}" data-page="${i.id}">${nm}</button>`;}).join('');
  $$('#pillNav .chip').forEach(b=> b.onclick=()=>{ state.page=b.dataset.page; render(); });
}

$$('.role-switch button').forEach(b=> b.onclick = ()=>{
  state.role = b.dataset.role;
  $$('.role-switch button').forEach(x=>x.classList.toggle('on', x===b));
  $('#avatarBox').textContent = state.role==='admin' ? '대표' : '담당';
  render();
});

    <div class="kpi"><div class="k-label">판매 진행</div>
      <div class="k-value">${salesOpen.length}<span class="unit">건</span></div>
      <div class="k-delta flat">판매 예정가 ${만(plannedAmt)}만원</div></div>
    <div class="kpi"><div class="k-label">판매 확정</div>
      <div class="k-value">${salesDone.length}<span class="unit">건</span></div>
      <div class="k-delta up">실제 판매가 ${만(actualAmt)}만원</div></div>
    <div class="kpi"><div class="k-label">확정 수익</div>

      <div class="k-delta flat">확정 건 기준</div></div>
    <div class="kpi"><div class="k-label">하나은행 환율</div>
      <div class="k-value" style="font-size:18px">연동 확인 중</div>
      <div class="k-delta flat">실제 연동 방식 검토 필요</div></div>
  </div>

  <div class="split">
    <div class="grid">
      <div class="card">
        <div class="card-head"><h3 class="card-title">영업 현황</h3>
          <button class="btn sm" data-go="sales">영업 관리에서 보기</button></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>영업 건</th><th>고객사</th><th>상태</th><th class="num">매입가</th><th class="num">판매 예정가</th><th class="num">실제 판매가</th><th class="num">확정 수익</th></tr></thead>
          <tbody>${DEALS.map(d=>`
            <tr class="clickable" data-deal="${d.id}">

              <td>${d.status==='확정'?'<span class="badge b-green">판매 확정</span>':'<span class="badge b-amber">판매 진행</span>'}</td>
              <td class="num">${만(d.buy)}만</td>
              <td class="num">${d.plannedSell? 만(d.plannedSell)+'만':'—'}</td>
              <td class="num">${d.sell? 만(d.sell)+'만':'<span class="muted">—</span>'}</td>
              <td class="num strong" style="color:${d.sell?'var(--ok)':'var(--ink-3)'}">${d.sell? 만(d.sell-d.buy)+'만':'—'}</td>
            </tr>`).join('')}</tbody>

      <div class="card">
        <div class="card-head"><h3 class="card-title">매입 진행</h3><span class="badge b-blue">${purchaseOpen.length}건</span></div>

        <div class="card-body" style="font-size:12.5px;color:var(--ink-2)">
          하나은행 기준 환율 제공 방향으로 검토 중입니다. 이 목업에서는 임의 환율 숫자를 표시하지 않으며, 실제 연동 가능 여부와 방식이 확정된 뒤 반영합니다.
        </div>
      </div>
    </div>
  </div>`;
}

function openEquip(id, tab){
  state.sel = id; modalTab = tab || 'memo';
  const e = eqById(id); if(!e) return;
  const q = QUOTES.filter(x=>x.eq===id);
  const deal = DEALS.find(d=>d.equips.includes(id));

  const tabs = [['memo','메모'],['photo',`사진 (${e.photos})`],['quote',`견적 (${q.length})`],['file',`첨부 (${e.atts.length})`],['info','기본 정보']];

  openModal(`
    <div class="modal-head">
      <div>
        <h3 class="modal-title">${e.model}</h3>
        <div class="modal-sub"><span style="font-family:var(--mono)">${e.no}</span> · ${e.ton?e.ton+' TON · ':''}${stageOf(e.stage).name}
          ${deal? ` · 영업 건 <b style="color:var(--brand)">${deal.name}</b>`:''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        ${e.status==='판매확정'?'<span class="badge b-green">판매확정</span>':e.status==='영업중'?'<span class="badge b-amber">영업중</span>':'<span class="badge b-gray">재고</span>'}
        <button class="x" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="tabs" id="eqTabs">${tabs.map(([k,n])=>`<button class="tab ${modalTab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}</div>
      <div id="eqPane"></div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" onclick="toast('목업 — 삭제되지 않습니다')">삭제</button>
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" onclick="toast('저장되었습니다 (목업)')">저장</button>
    </div>`, 'wide');

  $$('#eqTabs .tab').forEach(b=> b.onclick=()=>{ modalTab=b.dataset.t;
    $$('#eqTabs .tab').forEach(x=>x.classList.toggle('on',x===b)); paintEqPane(e); });
  paintEqPane(e);
}

function paintEqPane(e){
  const pane = $('#eqPane');
  if(modalTab==='memo') pane.innerHTML = paneMemo(e), bindEditor(e);
  else if(modalTab==='photo') pane.innerHTML = panePhoto(e), bindPhoto(e);
  else if(modalTab==='quote') pane.innerHTML = paneQuote(e);
  else if(modalTab==='file') pane.innerHTML = paneFile(e);
  else pane.innerHTML = paneInfo(e);
}

function paneMemo(e){
  return `
  <div class="editor">
    <div class="editor-bar">
      <button class="eb" data-cmd="bold" title="굵게"><b>B</b></button>
      <button class="eb" data-cmd="underline" title="밑줄"><u>U</u></button>
      <button class="eb" data-cmd="italic" title="기울임"><i>I</i></button>
      <span class="eb-sep"></span>
      <select class="eb wide" id="fsz" title="폰트 크기" style="border:none;background:none;outline:none">
        <option value="2">작게</option><option value="3" selected>보통</option><option value="4">크게</option><option value="5">아주 크게</option>
      </select>
      <span class="eb-sep"></span>
      <button class="eb" data-cmd="insertUnorderedList" title="목록">≡</button>
      <button class="eb wide" id="linkBtn" title="하이퍼링크">🔗 링크</button>
      <button class="eb wide" id="tplBtn" title="기본 템플릿 삽입">▤ 템플릿</button>
      <span class="eb-sep"></span>
      <button class="eb wide" id="urlBtn" title="동영상 URL 붙여넣기">▶ 영상 URL</button>
    </div>
    <div class="editor-area" id="memoArea" contenteditable="true">${e.memo}${e.video?embedHTML(e.video):''}</div>
    <div class="drop-zone" id="dz">
      <span>📎 파일을 이 영역에 <b>드래그 앤 드롭</b>하면 첨부됩니다 (파일당 30MB 이하)</span>
      <span id="attList" style="display:flex;gap:6px;flex-wrap:wrap">${e.atts.map(a=>attHTML(a)).join('')}</span>
    </div>
  </div>
  <div class="muted" style="font-size:11.5px;margin-top:8px">
    최종 수정: ${e.memoDate} · 서장원 &nbsp;|&nbsp; 목록에서는 이 메모의 앞 2줄이 미리보기로 노출됩니다.
  </div>`;
}
const attHTML = a => `<span class="att">📄 ${esc(a.n)} <span class="sz">${a.s}</span> <span class="rm">✕</span></span>`;
function embedHTML(url){
  return `<div class="embed" contenteditable="false">
    <div class="thumb" style="background:#c1362f">▶</div>
    <div><div class="t">YouTube 비공개/일부공개 영상 링크</div><div class="u">${esc(url)}</div></div></div>`;
}

function bindEditor(e){
  const area = $('#memoArea');
  $$('#eqPane .eb[data-cmd]').forEach(b=> b.onmousedown = ev=>{ ev.preventDefault(); document.execCommand(b.dataset.cmd,false,null); });
  $('#fsz').onchange = ev=>{ area.focus(); document.execCommand('fontSize',false,ev.target.value); };
  $('#linkBtn').onmousedown = ev=>{ ev.preventDefault();
    const u = prompt('링크 주소를 입력하세요','https://'); if(u) document.execCommand('createLink',false,u); };
  $('#tplBtn').onmousedown = ev=>{ ev.preventDefault();
    document.execCommand('insertHTML',false, memoHTML(MEMO_TEMPLATE,'')); toast('기본 사양 템플릿을 삽입했습니다'); };
  $('#urlBtn').onmousedown = ev=>{ ev.preventDefault();
    const u = prompt('YouTube 비공개/일부공개 영상 URL을 붙여넣으세요','https://youtu.be/');
    if(u && /youtu/.test(u)){ document.execCommand('insertHTML',false, embedHTML(u)); toast('YouTube 링크가 삽입되었습니다'); }
    else if(u){ toast('현재 범위에서는 YouTube URL만 사용합니다'); } };

  const dz = $('#dz');
  ['dragenter','dragover'].forEach(t=> dz.addEventListener(t, ev=>{ ev.preventDefault(); dz.classList.add('hot'); }));
  ['dragleave','drop'].forEach(t=> dz.addEventListener(t, ev=>{ ev.preventDefault(); dz.classList.remove('hot'); }));
