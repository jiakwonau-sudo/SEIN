<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세인코퍼레이션 통합 관리 시스템 · FULL v1.5.0</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc;
  --line:#e3e6ea; --line-strong:#cdd3da;
  --ink:#171a1f; --ink-2:#4c5560; --ink-3:#8a939f;
  --brand:#1b4f9c; --brand-2:#2f6fd0; --brand-soft:#eaf1fb;
  --ok:#0f8a53; --ok-soft:#e6f5ed;
  --warn:#b5730a; --warn-soft:#fdf3e2;
  --danger:#c1362f; --danger-soft:#fdeceb;
  --violet:#6b4fbb; --violet-soft:#f0ecfb;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.18);
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--brand-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8cdd4;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── 목업 배너 ───────────────────────── */
.mock-flag{
  background:linear-gradient(90deg,#1b4f9c,#2f6fd0);color:#fff;
  font-size:12px;padding:6px 16px;display:flex;gap:10px;align-items:center;justify-content:center;letter-spacing:-.2px
}
.mock-flag b{font-weight:700}
.mock-flag span{opacity:.8}

/* ── 상단 헤더 ───────────────────────── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:60
}
.topbar-row{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.5px;font-size:15px;white-space:nowrap}
.logo .mark{
  width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800
}
.logo small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.cats{display:flex;align-items:center;gap:4px;margin-left:12px;flex:1;overflow-x:auto}
.cat{
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;border:1px solid transparent;flex-shrink:0
}
.cat:hover{background:var(--surface-2);color:var(--ink)}
.cat.on{background:var(--brand);color:#fff}
.cat.ghost{color:var(--ink-3);border:1px dashed var(--line-strong)}
.cat-add{
  flex-shrink:0;padding:6px 10px;border-radius:999px;border:1px dashed var(--line-strong);
  color:var(--ink-3);font-size:12.5px;font-weight:600
}
.cat-add:hover{border-color:var(--brand-2);color:var(--brand-2)}
.topbar-right{display:flex;align-items:center;gap:10px}
.role-switch{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px
}
.role-switch button{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.role-switch button.on{background:var(--ink);color:#fff}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;border:1px solid #d6e3f7
}

/* ── 레이아웃 ────────────────────────── */
.shell{display:flex;min-height:calc(100vh - 85px)}
.side{
  width:212px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 10px;position:sticky;top:85px;height:calc(100vh - 85px);overflow-y:auto
}
.side-group{margin-bottom:16px}
.side-label{font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.6px;padding:0 10px 6px}
.nav{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--radius);
  font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;margin-bottom:1px
}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav .ic{width:16px;text-align:center;font-size:14px;opacity:.85}
.nav .lock{margin-left:auto;font-size:10px;color:var(--ink-3)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 7px;font-weight:700}
.nav.on .cnt{background:#d6e3f7;color:var(--brand)}
.main{flex:1;min-width:0;padding:22px 26px 60px}

/* ── 페이지 헤더 ─────────────────────── */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0}
.page-sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── 버튼 ────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);
  font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)
}
.btn:hover{background:var(--surface-2);border-color:#b9c0c9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#173f7d}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.93)}
.btn.danger{color:var(--danger);border-color:#f0c4c1}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px}

/* ── 카드 ────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-size:14px;font-weight:700;margin:0;letter-spacing:-.2px}
.card-body{padding:16px}
.grid{display:grid;gap:14px}

/* ── KPI ─────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-value{font-size:24px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-value .unit{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:5px}
.k-delta.up{color:var(--ok)} .k-delta.down{color:var(--danger)} .k-delta.flat{color:var(--ink-3)}

/* ── 배지 ────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:700;line-height:1.7;white-space:nowrap
}
.b-blue{background:var(--brand-soft);color:var(--brand)}
.b-green{background:var(--ok-soft);color:var(--ok)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-gray{background:#eef0f3;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ── 테이블 ──────────────────────────── */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.2px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap
}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:#fafcff}
table.tbl tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.strong{font-weight:700}
.nowrap{white-space:nowrap}

/* ── 필터 바 ─────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters>span{white-space:nowrap}
.field{
  display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--radius);padding:0 10px;height:34px
}
.field input,.field select{border:none;outline:none;background:none;font-size:13px;min-width:0}
.field input::placeholder{color:var(--ink-3)}
.field .ic{color:var(--ink-3);font-size:13px}
.chip{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex-shrink:0
}
.chip:hover{border-color:var(--brand-2);color:var(--brand-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}

/* ── 설비 카드 그리드 ────────────────── */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.eq:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#c6d5ea}
.eq-thumb{height:132px;position:relative;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.5px}
.eq-thumb .ph{font-size:34px;opacity:.55}
.eq-thumb .tag-stage{position:absolute;left:10px;bottom:10px}
.eq-thumb .tag-cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700}
.eq-body{padding:12px 13px}
.eq-model{font-weight:800;font-size:14px;letter-spacing:-.3px}
.eq-no{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:1px}
.eq-memo{
  margin-top:9px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:7px 9px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.eq-memo .mt{font-size:10.5px;color:var(--ink-3);font-weight:700;display:block;margin-bottom:2px}
.eq-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:6px}
.eq-price{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── 모달 ────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
  backdrop-filter:blur(2px)
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:14px;width:100%;max-width:880px;box-shadow:var(--shadow-lg);
  animation:pop .16s ease-out
}
.modal.wide{max-width:1060px}
.modal.narrow{max-width:520px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px;margin:0}
.modal-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.modal-body{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);border-radius:0 0 14px 14px}
.x{width:30px;height:30px;border-radius:7px;color:var(--ink-3);font-size:17px;display:grid;place-items:center}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* ── 탭 ──────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ── 폼 ──────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.f input,.f select,.f textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-size:13px;
  background:var(--surface);outline:none;width:100%
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,111,208,.12)}
.f .hint{font-size:11px;color:var(--ink-3)}
.f input[readonly]{background:var(--surface-2);color:var(--ink-2)}

/* ── 메모 에디터 ─────────────────────── */
.editor{border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.editor-bar{display:flex;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.eb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-weight:700}
.eb:hover{background:#e9edf2;color:var(--ink)}
.eb.wide{width:auto;padding:0 9px;font-size:12px;gap:4px;display:flex}
.eb-sep{width:1px;height:18px;background:var(--line-strong);margin:0 4px}
.editor-area{
  min-height:230px;padding:14px 16px;outline:none;font-size:13.5px;line-height:1.75;
}
.editor-area:focus{background:#fffefb}
.editor-area h4{margin:14px 0 6px;font-size:13px;color:var(--brand);letter-spacing:-.2px}
.editor-area h4:first-child{margin-top:0}
.editor-area ul{margin:4px 0;padding-left:20px}
.editor-area .spec-line{display:flex;gap:8px;padding:2px 0}
.editor-area .spec-line b{min-width:96px;color:var(--ink-2);font-weight:700;font-size:12.5px}
.drop-zone{
  border-top:1px dashed var(--line-strong);padding:10px 14px;font-size:12px;color:var(--ink-3);
  background:var(--surface-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.drop-zone.hot{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-2)}
.att{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2)
}
.att .sz{color:var(--ink-3);font-weight:500}
.att .rm{color:var(--ink-3);font-size:13px;line-height:1}
.embed{
  border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;
  background:var(--surface-2);margin:8px 0;max-width:400px
}
.embed .thumb{width:88px;height:52px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.embed .t{font-size:12.5px;font-weight:700}
.embed .u{font-size:11px;color:var(--ink-3);word-break:break-all}

/* ── 사진 갤러리 ─────────────────────── */
.stage-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);position:relative}
.ph-card .im{height:96px;display:grid;place-items:center;color:#fff;font-size:22px;opacity:.9}
.ph-card .meta{padding:7px 8px;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:4px}
.ph-card input[type=checkbox]{position:absolute;top:7px;left:7px;width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.dl-note{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid #f3e0bd;border-radius:6px;padding:7px 10px;margin-top:10px}

.lock-note{
  display:flex;gap:10px;align-items:flex-start;background:var(--violet-soft);border:1px solid #ddd4f5;
  border-radius:var(--radius);padding:11px 13px;font-size:12.5px;color:#4a3785;margin-bottom:14px
}
.lock-note b{color:var(--violet)}
.denied{text-align:center;padding:72px 20px;color:var(--ink-3)}
.denied .lk{font-size:40px;margin-bottom:12px;opacity:.5}
.denied h3{margin:0 0 6px;color:var(--ink);font-size:16px}

/* ── 캘린더 ──────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .dh{background:var(--surface-2);font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:96px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px}
.cal .dc.dim{background:var(--surface-2);color:var(--ink-3)}
.cal .dn{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.cal .dc.today .dn{background:var(--brand);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.ev{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 기타 ────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;
  transition:.2s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:80vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty .ic{font-size:36px;opacity:.4;margin-bottom:10px}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--ink-2)}
.split{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.row-red{background:#fef7f6}
.row-gray{background:#f7f8f9;color:var(--ink-3)}
.row-amber{background:#fffbf3}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--brand-2)}
.note-input{width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:9px 11px;font-size:13px;outline:none;resize:vertical;min-height:56px}
.note-input:focus{border-color:var(--brand-2)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 14px}
.tl-item:before{content:"";position:absolute;left:-17px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.tl-item .w{font-size:11px;color:var(--ink-3);font-weight:700}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 2400);
}
function openModal(html, cls){
  const m = $('#modal'); m.className = 'modal ' + (cls||''); m.innerHTML = html;
  $('#overlay').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; }
$('#overlay').addEventListener('mousedown', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function renderSide(){
  const side = $('#side');

  let h='';

    h += `<div class="side-group"><div class="side-label">${g.g}</div>`;
    items.forEach(i=>{

  });
  $('#side').innerHTML = h;
  $$('#side .nav[data-page]').forEach(b=> b.onclick = ()=>{ state.page=b.dataset.page; render(); });

  $('#pillNav').innerHTML = NAVS.flatMap(g=>g.items).map(i=>{
    const nm = (state.cat==='asahi' && i.id==='goods') ? '제품 드라이브' : i.name;
    return `<button class="chip ${state.page===i.id?'on':''}" data-page="${i.id}">${nm}</button>`;}).join('');

}

      <div class="k-value">${salesOpen.length}<span class="unit">건</span></div>

      ? `<div class="eq-grid">${list.map(card).join('')}</div>`
      : `<div class="card"><div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>설비</th><th>톤수</th><th>단계</th><th>최신 메모 미리보기</th><th>메모일</th><th class="num">판매가</th><th>상태</th></tr></thead>
          <tbody>${rows}</tbody></table></div></div>`}`;
}

/* ── 설비 상세 모달 ──────────────────────────────────── */
let modalTab = 'memo';
function openEquip(id, tab){
  state.sel = id; modalTab = tab || 'memo';
  const e = eqById(id); if(!e) return;
  const q = QUOTES.filter(x=>x.eq===id);
  const deal = DEALS.find(d=>d.equips.includes(id));

  const tabs = [['memo','메모'],['photo',`사진 (${e.photos})`],['quote',`견적 (${q.length})`],['file',`첨부 (${e.atts.length})`],['info','기본 정보']];

  openModal(`
    <div class="modal-head">
      <div>
        <h3 class="modal-title">${e.model}</h3>
        <div class="modal-sub"><span style="font-family:var(--mono)">${e.no}</span> · ${e.ton?e.ton+' TON · ':''}${stageOf(e.stage).name}
          ${deal? ` · 영업 건 <b style="color:var(--brand)">${deal.name}</b>`:''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        ${e.status==='판매확정'?'<span class="badge b-green">판매확정</span>':e.status==='영업중'?'<span class="badge b-amber">영업중</span>':'<span class="badge b-gray">재고</span>'}
        <button class="x" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="tabs" id="eqTabs">${tabs.map(([k,n])=>`<button class="tab ${modalTab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}</div>
      <div id="eqPane"></div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" onclick="toast('목업 — 삭제되지 않습니다')">삭제</button>
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" onclick="toast('저장되었습니다 (목업)')">저장</button>
    </div>`, 'wide');

  $$('#eqTabs .tab').forEach(b=> b.onclick=()=>{ modalTab=b.dataset.t;
    $$('#eqTabs .tab').forEach(x=>x.classList.toggle('on',x===b)); paintEqPane(e); });
  paintEqPane(e);
}

function paintEqPane(e){
  const pane = $('#eqPane');
  if(modalTab==='memo') pane.innerHTML = paneMemo(e), bindEditor(e);
  else if(modalTab==='photo') pane.innerHTML = panePhoto(e), bindPhoto(e);
  else if(modalTab==='quote') pane.innerHTML = paneQuote(e);
  else if(modalTab==='file') pane.innerHTML = paneFile(e);
  else pane.innerHTML = paneInfo(e);
}

function paneMemo(e){
  return `
  <div class="editor">
    <div class="editor-bar">
      <button class="eb" data-cmd="bold" title="굵게"><b>B</b></button>
      <button class="eb" data-cmd="underline" title="밑줄"><u>U</u></button>
      <button class="eb" data-cmd="italic" title="기울임"><i>I</i></button>
      <span class="eb-sep"></span>
      <select class="eb wide" id="fsz" title="폰트 크기" style="border:none;background:none;outline:none">
        <option value="2">작게</option><option value="3" selected>보통</option><option value="4">크게</option><option value="5">아주 크게</option>
      </select>
      <span class="eb-sep"></span>
      <button class="eb" data-cmd="insertUnorderedList" title="목록">≡</button>
      <button class="eb wide" id="linkBtn" title="하이퍼링크">🔗 링크</button>
      <button class="eb wide" id="tplBtn" title="기본 템플릿 삽입">▤ 템플릿</button>
      <span class="eb-sep"></span>
      <button class="eb wide" id="urlBtn" title="동영상 URL 붙여넣기">▶ 영상 URL</button>
    </div>
    <div class="editor-area" id="memoArea" contenteditable="true">${e.memo}${e.video?embedHTML(e.video):''}</div>
    <div class="drop-zone" id="dz">
      <span>📎 파일을 이 영역에 <b>드래그 앤 드롭</b>하면 첨부됩니다 (파일당 30MB 이하)</span>
      <span id="attList" style="display:flex;gap:6px;flex-wrap:wrap">${e.atts.map(a=>attHTML(a)).join('')}</span>
    </div>
  </div>
  <div class="muted" style="font-size:11.5px;margin-top:8px">
    최종 수정: ${e.memoDate} · 서장원 &nbsp;|&nbsp; 목록에서는 이 메모의 앞 2줄이 미리보기로 노출됩니다.
  </div>`;
}
const attHTML = a => `<span class="att">📄 ${esc(a.n)} <span class="sz">${a.s}</span> <span class="rm">✕</span></span>`;
function embedHTML(url){
  return `<div class="embed" contenteditable="false">
    <div class="thumb" style="background:#c1362f">▶</div>
    <div><div class="t">YouTube 비공개/일부공개 영상 링크</div><div class="u">${esc(url)}</div></div></div>`;
}

function bindEditor(e){
  const area = $('#memoArea');
  $$('#eqPane .eb[data-cmd]').forEach(b=> b.onmousedown = ev=>{ ev.preventDefault(); document.execCommand(b.dataset.cmd,false,null); });
  $('#fsz').onchange = ev=>{ area.focus(); document.execCommand('fontSize',false,ev.target.value); };
  $('#linkBtn').onmousedown = ev=>{ ev.preventDefault();
    const u = prompt('링크 주소를 입력하세요','https://'); if(u) document.execCommand('createLink',false,u); };
  $('#tplBtn').onmousedown = ev=>{ ev.preventDefault();
    document.execCommand('insertHTML',false, memoHTML(MEMO_TEMPLATE,'')); toast('기본 사양 템플릿을 삽입했습니다'); };
  $('#urlBtn').onmousedown = ev=>{ ev.preventDefault();
    const u = prompt('YouTube 비공개/일부공개 영상 URL을 붙여넣으세요','https://youtu.be/');
    if(u && /youtu/.test(u)){ document.execCommand('insertHTML',false, embedHTML(u)); toast('YouTube 링크가 삽입되었습니다'); }
    else if(u){ toast('현재 범위에서는 YouTube URL만 사용합니다'); } };

  const dz = $('#dz');
  ['dragenter','dragover'].forEach(t=> dz.addEventListener(t, ev=>{ ev.preventDefault(); dz.classList.add('hot'); }));
  ['dragleave','drop'].forEach(t=> dz.addEventListener(t, ev=>{ ev.preventDefault(); dz.classList.remove('hot'); }));
  dz.addEventListener('drop', ev=>{
    const fs = Array.from(ev.dataTransfer.files||[]);
    if(!fs.length){ toast('파일을 인식하지 못했습니다'); return; }
    fs.forEach(f=> $('#attList').insertAdjacentHTML('beforeend', attHTML({n:f.name, s:(f.size/1048576).toFixed(1)+'MB'})));
    toast(`${fs.length}개 파일을 첨부했습니다 (목업)`);
  });
  $('#attList').addEventListener('click', ev=>{ if(ev.target.classList.contains('rm')) ev.target.parentElement.remove(); });
}

function panePhoto(e){
  const photos = Array.from({length:e.photos},(_,i)=>{
    const st = STAGES[(i+ (e.photos%5)) % STAGES.length];
    return {i:i+1, st};
  });
  const shown = state.photoStage==='all' ? photos : photos.filter(p=>p.st.id===state.photoStage);
  return `
  <div class="stage-bar">
    <span class="muted" style="font-size:12px">단계별 태그</span>
    <button class="chip ${state.photoStage==='all'?'on':''}" data-ps="all">전체 (${photos.length})</button>
    ${STAGES.map(s=>{const n=photos.filter(p=>p.st.id===s.id).length;
      return `<button class="chip ${state.photoStage===s.id?'on':''}" data-ps="${s.id}">${s.name} (${n})</button>`}).join('')}
    <span style="flex:1"></span>
    <button class="btn sm" id="dlBtn">선택 일괄 다운로드</button>
    <button class="btn sm primary" onclick="toast('목업 — 업로드는 시연되지 않습니다')">＋ 사진 업로드</button>
  </div>
  <div class="gal">${shown.map(p=>`
    <div class="ph-card">
      <input type="checkbox" class="phchk">
      <div class="im" style="background:linear-gradient(135deg,${p.st.color},${p.st.color}aa)">▤</div>
      <div class="meta"><span class="badge" style="background:${p.st.color}1a;color:${p.st.color};font-size:10.5px">${p.st.name}</span>
        <span>IMG_${String(1200+p.i)}</span></div>
    </div>`).join('')}</div>
  <div class="dl-note">⚠ 일괄 다운로드는 브라우저·용량 제한으로 <b>최대 20~30장</b> 선택 방식으로 구현됩니다. 초과 선택 시 예외 안내가 노출됩니다. (허용 범위는 클라이언트 확정 필요)</div>`;
}
function bindPhoto(e){
  $$('#eqPane .chip[data-ps]').forEach(b=> b.onclick=()=>{ state.photoStage=b.dataset.ps; paintEqPane(e); });
  $('#dlBtn').onclick = ()=>{
    const n = $$('#eqPane .phchk').filter(c=>c.checked).length;
    if(n===0) return toast('다운로드할 사진을 선택해 주세요');
    if(n>30) return toast(`선택 ${n}장 — 한 번에 최대 30장까지만 다운로드할 수 있습니다`);
    toast(`${n}장 압축 다운로드를 시작합니다 (목업)`);
  };
}

function paneQuote(e){
  const q = QUOTES.filter(x=>x.eq===e.id);
  const fixed = q.find(x=>x.kind.startsWith('확정'));
  return `
  <div class="lock-note" style="background:var(--brand-soft);border-color:#d6e3f7;color:#1b3f72">
    <span>ℹ</span><div>설비 1건당 <b>최종 확정 견적(실비 기준) 1건만</b> 연동됩니다. 예상 비용 기반 견적은 <b>영업 관리 탭</b>에서 관리하며, 세부 견적서는 파일로 보관합니다.</div>
  </div>
  <div class="card" style="box-shadow:none">
    <div class="card-head"><h3 class="card-title">확정 견적 (실비)</h3>
      ${fixed?'<span class="badge b-green">연동됨</span>':'<span class="badge b-gray">미등록</span>'}</div>
    <div class="card-body">
      ${fixed? `<div class="form-grid">
        <div class="f"><label>견적 번호</label><input value="${fixed.id}" readonly></div>
        <div class="f"><label>확정 금액 (실비)</label><input value="${W(fixed.amt)} 원" readonly></div>
        <div class="f"><label>확정일</label><input value="${fixed.date}" readonly></div>
        <div class="f"><label>작성자</label><input value="${fixed.by}" readonly></div>
      </div>
      <div style="margin-top:12px" class="att">📄 ${fixed.file} <span class="sz">클릭 시 미리보기(PDF)</span></div>`
      : `<div class="empty" style="padding:28px"><h3>확정 견적이 없습니다</h3><p class="muted" style="font-size:12.5px">판매 확정 시 실비 기준 견적 1건을 등록하세요.</p>
         <button class="btn primary sm" style="margin-top:10px" onclick="toast('목업 — 견적 등록 폼은 시연되지 않습니다')">확정 견적 등록</button></div>`}
    </div>
  </div>
  <div class="card" style="box-shadow:none;margin-top:12px">
    <div class="card-head"><h3 class="card-title">예상 견적 이력 (영업 관리 연동)</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>견적번호</th><th>구분</th><th class="num">금액</th><th>작성일</th><th>작성자</th><th>첨부</th></tr></thead>
      <tbody>${q.length? q.map(x=>`<tr>
        <td class="strong">${x.id}</td>
        <td>${x.kind.startsWith('확정')?'<span class="badge b-green">확정(실비)</span>':'<span class="badge b-blue">예상(영업)</span>'}</td>
        <td class="num">${W(x.amt)}</td><td class="muted">${x.date}</td><td class="muted">${x.by}</td>
        <td><span class="muted" style="font-size:12px">📄 ${x.file}</span></td></tr>`).join('')
        : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">견적 이력이 없습니다</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function paneFile(e){
  return `
  <div class="filters" style="margin-bottom:12px">
    <button class="btn sm primary" onclick="toast('목업 — 파일당 30MB 이하 업로드 기준')">＋ 파일 업로드</button>
    <span class="muted" style="font-size:12px">파일당 기본 30MB 제한 · 대용량 업로드 전용 솔루션은 이번 범위에서 제외</span>
  </div>
  <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>파일명</th><th>형식</th><th class="num">용량</th><th>등록일</th><th>미리보기</th><th></th></tr></thead>
    <tbody>${e.atts.length? e.atts.map(a=>{
      const ext = a.n.split('.').pop().toUpperCase();
      const prev = ext==='PDF';
      return `<tr><td class="strong">📄 ${esc(a.n)}</td><td><span class="badge b-gray">${ext}</span></td>
        <td class="num">${a.s}</td><td class="muted">2026-08-${10+e.atts.indexOf(a)}</td>
        <td>${prev?'<span class="badge b-green">지원</span>':'<span class="badge b-amber">별도 개발 필요</span>'}</td>
        <td class="num"><button class="btn xs" onclick="toast('목업 — 다운로드되지 않습니다')">받기</button></td></tr>`}).join('')
      : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">등록된 파일이 없습니다</td></tr>'}</tbody>
  </table></div></div>
  <div class="dl-note" style="margin-top:12px">ℹ 미리보기는 <b>PDF만 기본 지원</b>합니다. 워드·엑셀·한글 등은 형식별 커스텀 개발이 필요합니다. 폴더 구조 통째 업로드는 지원하지 않으며, 기존 자료(약 500GB, 폴더 17,000개+)는 전체 이관이 아니라 필요 자료를 선별해 이전 범위를 검토합니다.</div>`;
}

function paneInfo(e){
  return `
  <div class="lock-note" style="background:var(--warn-soft);border-color:#f3e0bd;color:#7a4f06">
    <span>ℹ</span><div>불필요한 분류 항목은 제거하고 <b>모델명·설비번호 등 핵심 고정 속성만</b> 유지합니다. 나머지 사양 정보는 <b>메모 탭</b>에서 자유 입력으로 관리합니다.</div>
  </div>
  <div class="form-grid">
    <div class="f"><label>모델명 *</label><input value="${esc(e.model)}"></div>
    <div class="f"><label>설비 번호 *</label><input value="${e.no}"></div>
    <div class="f"><label>카테고리</label><select><option ${e.cat==='used'?'selected':''}>중고 설비</option><option ${e.cat==='asahi'?'selected':''}>아사히 세이키</option></select></div>
    <div class="f"><label>상태</label><select><option ${e.status==='재고'?'selected':''}>재고</option><option ${e.status==='영업중'?'selected':''}>영업중</option><option ${e.status==='판매확정'?'selected':''}>판매확정</option></select></div>
    <div class="f"><label>현재 단계</label><select>${STAGES.map(s=>`<option ${e.stage===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="f"><label>연결 고객사</label><input value="${e.customer||''}" placeholder="영업 관리에서 자동 연결"></div>
    <div class="f"><label>매입가 (실비)</label><input value="${W(e.buy)}"></div>
    <div class="f"><label>판매가 (확정 시)</label><input value="${e.sell?W(e.sell):''}" placeholder="영업 확정 시 입력"></div>
  </div>`;
}
</script>
<script>
/* ══════════════════════════════════════════════════════════
   3. 영업 관리
   ══════════════════════════════════════════════════════════ */
function pageSales(){
  return `
  <div class="page-head">
    <div><h1 class="page-title">영업 관리</h1>
      <div class="page-sub">설비·고객·판매 진행을 연결 · 판매 예정가와 실제 판매가를 분리 관리</div></div>
    <div class="actions">
      <button class="btn" id="statBtn">📊 판매 수익 통계</button>
      <button class="btn primary" id="newDeal">＋ 영업 건 생성</button>
    </div>
  </div>

  <div class="filters">
    <div class="field" style="min-width:220px"><span class="ic">🔍</span><input placeholder="영업 건명 · 고객사 검색"></div>
    <button class="chip on">전체 ${DEALS.length}</button>
    <button class="chip">판매 진행 ${DEALS.filter(d=>d.status==='진행').length}</button>
    <button class="chip">판매 확정 ${DEALS.filter(d=>d.status==='확정').length}</button>
  </div>

  <div class="card">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>영업 건</th><th>고객사</th><th>묶인 설비</th><th>담당</th><th class="num">매입가</th><th class="num">판매 예정가</th><th class="num">실제 판매가</th><th class="num">확정 수익</th><th>상태</th></tr></thead>
      <tbody>${DEALS.map(d=>`
        <tr class="clickable" data-deal="${d.id}">
          <td><div class="strong">${d.name}</div><div class="eq-no">${d.id}</div></td>
          <td>${d.customer}</td>
          <td><div style="display:flex;gap:4px;flex-wrap:wrap">${d.equips.map(id=>{ const e=eqById(id); return `<span class="badge b-blue">${e?e.model.split(' ')[0]+' '+(e.ton?e.ton+'T':''):id}</span>`}).join('')}</div></td>
          <td class="muted">${d.owner}</td><td class="num">${만(d.buy)}만</td>
          <td class="num">${d.plannedSell?만(d.plannedSell)+'만':'—'}</td>
          <td class="num">${d.sell?만(d.sell)+'만':'<span class="muted">—</span>'}</td>
          <td class="num strong" style="color:${d.sell?'var(--ok)':'var(--ink-3)'}">${d.sell?만(d.sell-d.buy)+'만':'—'}</td>
          <td>${d.status==='확정'?`<span class="badge b-green">확정 ${d.confirmedAt.slice(5)}</span>`:'<span class="badge b-amber">진행중</span>'}</td>
        </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

let dealTab='memo';
function openDeal(id){
  const d = DEALS.find(x=>x.id===id); if(!d) return;
  dealTab='memo';
  openModal(`
    <div class="modal-head">
      <div><h3 class="modal-title">${d.name}</h3>
        <div class="modal-sub"><span style="font-family:var(--mono)">${d.id}</span> · ${d.customer} · 담당 ${d.owner}
        ${d.status==='확정'?` · 확정일 ${d.confirmedAt}`:''}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        ${d.status==='확정'?'<span class="badge b-green">판매 확정</span>':'<span class="badge b-amber">진행중</span>'}
        <button class="x" onclick="closeModal()">✕</button></div>
    </div>
    <div class="modal-body">
      <div class="tabs" id="dTabs">
        <button class="tab on" data-t="memo">공유 메모 (${d.memos.length})</button>
        <button class="tab" data-t="eq">묶인 설비 (${d.equips.length})</button>
        <button class="tab" data-t="price">확정 / 금액 입력</button>
      </div>
      <div id="dPane"></div>
    </div>
    <div class="modal-foot">

function openBind(d){
  const cand = EQUIP.filter(e=> !d.equips.includes(e.id));
  openModal(`
    <div class="modal-head"><div><h3 class="modal-title">설비 묶기</h3>
      <div class="modal-sub">${d.name} · 복수 선택 가능</div></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${cand.map(e=>`
      <label class="pick-row"><input type="checkbox" value="${e.id}">
        <div style="width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,${e.color},${e.color}bb)"></div>
        <div style="flex:1"><div class="strong">${e.model}</div><div class="eq-no">${e.no} · ${stageOf(e.stage).name}</div></div>
        <span class="muted" style="font-size:12px">매입 ${만(e.buy)}만</span></label>`).join('')}</div>
    <div class="modal-foot"><button class="btn" onclick="openDeal('${d.id}')">뒤로</button>
      <button class="btn primary" id="bindOk">선택 설비 묶기</button></div>`,'narrow');
  $('#bindOk').onclick = ()=>{
    const picked = $$('#modal input:checked').map(c=>c.value);
    if(!picked.length) return toast('묶을 설비를 선택해 주세요');
    const add = picked.filter(id=>!d.equips.includes(id));
    if(!add.length) return toast('선택한 설비가 이미 모두 묶여 있습니다');
    add.forEach(id=>{ d.equips.push(id); d.buy += (eqById(id)?.buy||0); });
    openDeal(d.id); toast(`${add.length}대를 영업 건에 묶었습니다`);
  };
}

function confirmDeal(id){
  const d = DEALS.find(x=>x.id===id);
  openModal(`
    <div class="modal-head"><div><h3 class="modal-title">영업 확정 처리</h3>
      <div class="modal-sub">${d.name}</div></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="lock-note" style="background:var(--ok-soft);border-color:#c3e8d5;color:#0a5c38"><span>✔</span>
        <div>확정 시 상태가 <b>확정</b>으로 표시되고, 입력한 매입가·판매가가 <b>대시보드 지표와 수익 통계</b>에 반영됩니다.</div></div>
      <div class="form-grid">
        <div class="f"><label>실제 매입가 (원)</label><input id="cBuy" value="${W(d.buy)}"></div>
        <div class="f"><label>판매 예정가 (원)</label><input value="${d.plannedSell?W(d.plannedSell):''}" readonly></div>
        <div class="f"><label>실제 판매가 (원)</label><input id="cSell" placeholder="판매 확정 금액 입력"></div>
        <div class="f"><label>확정일</label><input id="cDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="openDeal('${id}')">취소</button>
      <button class="btn ok" id="cOk">확정</button></div>`,'narrow');
  $('#cOk').onclick = ()=>{
    const sell = Number(($('#cSell').value||'').replace(/[^\d]/g,''));
    const buy = Number(($('#cBuy').value||'').replace(/[^\d]/g,''));
    const confirmedAt = $('#cDate').value || new Date().toISOString().slice(0,10);
    if(!sell) return toast('실제 판매가를 입력해 주세요');
    d.buy = buy; d.sell = sell; d.status='확정'; d.confirmedAt=confirmedAt;
    closeModal(); render(); toast('영업 건이 확정되었습니다 — 대시보드에 반영됩니다');
  };
}

function openStats(){
  const done = DEALS.filter(d=>d.status==='확정');
  const profits = done.map(d=>d.sell-d.buy);
  const avg = profits.length? profits.reduce((a,b)=>a+b,0)/profits.length : 0;
  openModal(`
    <div class="modal-head"><div><h3 class="modal-title">판매 수익 통계</h3>
      <div class="modal-sub">확정 건 기준 · 2026년</div></div><button class="x" onclick="closeModal()">✕</button></div>

        <div class="kpi"><div class="k-label">평균 수익</div><div class="k-value">${만(avg)}<span class="unit">만원</span></div></div>
        <div class="kpi"><div class="k-label">최고 수익</div><div class="k-value">${만(Math.max(0,...profits))}<span class="unit">만원</span></div></div>

function bindCustomer(){
  $('#chkAll').onchange = e=> $$('.cchk').forEach(c=>{ if(!c.disabled) c.checked = e.target.checked; });
  $$('.bchk').forEach(b=> b.onchange = e=>{
    const i = +e.target.dataset.i;
    CUSTOMERS[i].flag = e.target.checked ? 'block' : (CUSTOMERS[i].mail? '' : 'nomail');
    render(); toast(e.target.checked? `${CUSTOMERS[i].co} — 송신 금지로 지정, 발송 대상에서 제외됩니다` : `${CUSTOMERS[i].co} — 송신 금지 해제`);
  });
  $('#bulkMail').onclick = openBulkMail;
  $('#copyInfo').onclick = ()=>{
    const picked = selectedCustomers();
    if(!picked.length) return toast('복사할 고객을 선택해 주세요');
    const txt = picked.map(c=>`${c.co} | ${c.p} | ${c.d} ${c.t} | ${c.tel} | ${c.mail}`).join('\n');
    (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(()=>toast(`${picked.length}건의 고객정보를 복사했습니다`))
      .catch(()=>toast('복사 권한이 없어 시연하지 못했습니다'));
  };
}

const FI = {
  folder:['f-folder','📁'], PDF:['f-pdf','PDF'], DWG:['f-dwg','DWG'], DXF:['f-dwg','DXF'],
  JPG:['f-img','IMG'], PNG:['f-img','IMG'], XLSX:['f-xls','XLS'], HWP:['f-doc','HWP'],
  DOCX:['f-doc','DOC'], MP4:['f-vid','▶'],
};
const fi = t =>{ const [c,l] = FI[t] || ['f-etc','FILE'];
  return `<span class="fi ${c}" style="font-size:${l.length>2?'8.5px':'12px'};font-weight:800">${l}</span>`; };

function driveNodeAt(path){
  let node = DRIVE;
  for(const seg of path){
    const next = (node.children||[]).find(c=>c.kind==='folder' && c.n===seg);
    if(!next) break;
    node = next;
  }
  return node;
}
function countIn(node){
  let f=0, d=0;
  (node.children||[]).forEach(c=> c.kind==='folder'? d++ : f++);
  return {d,f};
}
function totalFiles(node){
  if(node.kind==='file') return 1;
  return (node.children||[]).reduce((a,c)=>a+totalFiles(c),0);
}

function pageDrive(){
  const node = driveNodeAt(state.drivePath);
  const items = (node.children||[]).slice().sort((a,b)=>
    a.kind!==b.kind ? (a.kind==='folder'?-1:1) : a.n.localeCompare(b.n,'ko'));
  const {d,f} = countIn(node);

  const crumbs = ['아사히 세이키', ...state.drivePath].map((seg,i)=>{
    const last = i===state.drivePath.length;
    return `<button class="${last?'last':''}" data-crumb="${i}">${esc(seg)}</button>` +
      (last?'':'<span class="sep">›</span>');
  }).join('');

  // 좌측 폴더 트리 (2단계까지 펼침)
  const tree = (DRIVE.children||[]).filter(c=>c.kind==='folder').map(top=>{
    const open = state.drivePath[0]===top.n;
    const subs = open ? (top.children||[]).filter(c=>c.kind==='folder').map(sub=>
      `<button class="tree-item ${state.drivePath[1]===sub.n?'on':''}" data-path='${JSON.stringify([top.n,sub.n])}' style="padding-left:26px">
        <span class="fi f-folder" style="width:18px;height:18px;font-size:9px">📁</span><span class="nm">${esc(sub.n)}</span></button>`).join('') : '';
    return `<button class="tree-item ${state.drivePath.length===1&&open?'on':''}" data-path='${JSON.stringify([top.n])}'>
      <span class="tw">${open?'▾':'▸'}</span><span class="fi f-folder" style="width:18px;height:18px;font-size:9px">📁</span>
      <span class="nm">${esc(top.n)}</span></button>${subs}`;
  }).join('');

  const rows = items.map((it,i)=>`
    <tr class="clickable" data-open="${i}">
      <td onclick="event.stopPropagation()"><input type="checkbox" class="dchk" data-i="${i}" style="accent-color:var(--brand)"></td>
      <td><div class="name-cell">${it.kind==='folder'?fi('folder'):fi(it.t)}
        <span class="t">${esc(it.n)}</span></div></td>
      <td>${it.kind==='folder'?'<span class="badge b-gray">폴더</span>':`<span class="badge b-gray">${it.t}</span>`}</td>
      <td class="num nowrap">${it.kind==='folder'? `<span class="muted">${totalFiles(it)}개 항목</span>` : it.s}</td>
      <td class="muted nowrap">${it.kind==='folder'? (it.children&&it.children.length? '—':'—') : it.d}</td>
      <td class="muted nowrap">${it.kind==='folder'?'—':it.by}</td>
      <td>${it.kind==='folder'?'—':(it.t==='PDF'?'<span class="badge b-green">미리보기</span>':'<span class="badge b-amber">별도 개발</span>')}</td>
    </tr>`).join('');

  const tiles = items.map((it,i)=>`
    <div class="tile" data-open="${i}">
      ${it.kind==='folder'?fi('folder'):fi(it.t)}
      <div class="t">${esc(it.n)}</div>
      <div class="s">${it.kind==='folder'? totalFiles(it)+'개 항목' : it.s+' · '+it.d}</div>
    </div>`).join('');

  return `
  <div class="page-head">
    <div><h1 class="page-title">제품 드라이브</h1>
      <div class="page-sub">아사히 세이키 · 제품별 폴더 구조로 자료를 열람합니다 · 현재 폴더 ${d}개 · 파일 ${f}개 (전체 ${totalFiles(DRIVE)}개)</div></div>
    <div class="actions">
      <div class="seg"><button class="${state.driveView==='list'?'on':''}" data-dv="list">목록</button><button class="${state.driveView==='tile'?'on':''}" data-dv="tile">타일</button></div>

    <div class="field" style="min-width:240px"><span class="ic">🔍</span><input placeholder="이 폴더 및 하위 폴더에서 검색"></div>
    <div class="field"><select><option>전체 형식</option><option>PDF</option><option>도면(DWG·DXF)</option><option>사진</option><option>문서</option><option>영상</option></select></div>
    <div class="field"><select><option>이름순</option><option>최신 수정순</option><option>용량순</option></select></div>
  </div>

  <div class="drive">
    <aside class="tree">
      <div class="side-label" style="padding:2px 8px 8px">폴더</div>
      <button class="tree-item ${state.drivePath.length===0?'on':''}" data-path='[]'>
        <span class="tw"></span><span class="fi f-folder" style="width:18px;height:18px;font-size:9px">📁</span><span class="nm">아사히 세이키 (전체)</span></button>
      ${tree}
    </aside>

    <div>
      <div class="crumbs">
        ${state.drivePath.length? `<button id="dUpDir" title="상위 폴더" style="color:var(--ink-2)">↑</button><span class="sep">|</span>`:''}
        ${crumbs}
      </div>

      ${items.length===0
        ? `<div class="card drive-drop" id="dropArea"><div class="empty"><div class="ic">📂</div><h3>빈 폴더입니다</h3>
            <p style="font-size:13px">파일을 이 영역에 드래그 앤 드롭하거나 상단 <b>업로드</b> 버튼을 사용하세요.</p></div></div>`
        : state.driveView==='list'

              <thead><tr><th style="width:34px"><input type="checkbox" id="dAll" style="accent-color:var(--brand)"></th>
                <th>이름</th><th>종류</th><th class="num">크기</th><th>수정일</th><th>수정자</th><th>미리보기</th></tr></thead>
              <tbody>${rows}</tbody></table></div></div>`
          : `<div class="drive-drop" id="dropArea" style="border-color:transparent"><div class="tiles">${tiles}</div></div>`}

      <div class="dl-note" style="margin-top:14px">
        ℹ 폴더 <b>통째 업로드는 지원하지 않습니다</b>. 기존 자료(약 500GB, 폴더 17,000개+)는 필요성과 용량을 검토해 선별 이전 범위를 정합니다.
        일괄 다운로드는 브라우저·용량 제한으로 <b>최대 20~30개</b> 선택 방식이며, 허용 범위는 클라이언트 확정 후 반영합니다.
      </div>
    </div>
  </div>`;
}

function bindDrive(){
  const node = driveNodeAt(state.drivePath);
  const items = (node.children||[]).slice().sort((a,b)=>
    a.kind!==b.kind ? (a.kind==='folder'?-1:1) : a.n.localeCompare(b.n,'ko'));

  $$('[data-dv]').forEach(b=> b.onclick=()=>{ state.driveView=b.dataset.dv; render(); });
  $$('[data-path]').forEach(b=> b.onclick=()=>{ state.drivePath = JSON.parse(b.dataset.path); render(); });
  $$('[data-crumb]').forEach(b=> b.onclick=()=>{ state.drivePath = state.drivePath.slice(0, +b.dataset.crumb); render(); });
  if($('#dUpDir')) $('#dUpDir').onclick = ()=>{ state.drivePath.pop(); render(); };

  $$('[data-open]').forEach(el=> el.onclick = ()=>{
    const it = items[+el.dataset.open];
    if(!it) return;
    if(it.kind==='folder'){ state.drivePath = state.drivePath.concat([it.n]); render(); }
    else openFilePreview(it);
  });

  if($('#dAll')) $('#dAll').onchange = e=> $$('.dchk').forEach(c=> c.checked = e.target.checked);
  $('#dDl').onclick = ()=>{
    const n = $$('.dchk').filter(c=>c.checked).length;
    if(!n) return toast('다운로드할 항목을 선택해 주세요');
    if(n>30) return toast(`선택 ${n}개 — 한 번에 최대 30개까지만 다운로드할 수 있습니다`);
    toast(`${n}개 항목 압축 다운로드를 시작합니다 (목업)`);
  };
  $('#dUp').onclick = ()=> toast('목업 — 파일당 30MB 이하 업로드 기준입니다');
  $('#dNewFolder').onclick = ()=>{
    const n = prompt('새 폴더 이름', '새 폴더');
    if(!n) return;
    (node.children = node.children||[]).push(D(n, []));
    render(); toast(`"${n}" 폴더를 만들었습니다 (목업)`);
  };

  const da = $('#dropArea');
  if(da){
    ['dragenter','dragover'].forEach(t=> da.addEventListener(t, ev=>{ ev.preventDefault(); da.classList.add('hot'); }));
    ['dragleave','drop'].forEach(t=> da.addEventListener(t, ev=>{ ev.preventDefault(); da.classList.remove('hot'); }));
    da.addEventListener('drop', ev=>{
      const fs = Array.from(ev.dataTransfer.files||[]);
      if(!fs.length) return toast('폴더는 통째로 업로드할 수 없습니다 — 파일 단위로 올려주세요');
      fs.forEach(file=>{
        const ext = (file.name.split('.').pop()||'').toUpperCase();
        (node.children = node.children||[]).push(F(file.name, ext, (file.size/1048576).toFixed(1)+'MB','2026-08-24','서장원'));
      });
      render(); toast(`${fs.length}개 파일을 업로드했습니다 (목업)`);
    });
  }
}

function openFilePreview(it){
  const isPdf = it.t==='PDF', isImg = ['JPG','PNG'].includes(it.t), isVid = it.t==='MP4';
  const body = isPdf
    ? `<div class="prev-box"><div><div class="big">📄</div><b style="color:var(--ink)">PDF 미리보기</b>
        <div style="font-size:12.5px;margin-top:4px">브라우저 내장 뷰어로 바로 열람합니다 (단독 개발 지원 범위)</div></div></div>`
    : isImg
    ? `<div class="prev-box" style="background:linear-gradient(135deg,#6b4fbb,#6b4fbbaa);color:#fff"><div><div class="big">▤</div><b>이미지 미리보기</b></div></div>`
    : isVid
    ? `<div class="prev-box" style="background:#111;color:#fff"><div><div class="big">▶</div><b>동영상</b>
        <div style="font-size:12.5px;margin-top:4px">30MB 이하 영상 파일은 직접 업로드, 대용량/비공개 영상은 YouTube 비공개 URL 방식으로 연결합니다</div></div></div>`
    : `<div class="prev-box"><div><div class="big">🗎</div><b style="color:var(--warn)">미리보기 미지원 형식 (${it.t})</b>
        <div style="font-size:12.5px;margin-top:4px">워드·엑셀·한글 등은 형식별 커스텀 개발이 필요합니다.<br>현재는 다운로드 후 열람 방식입니다.</div></div></div>`;

  openModal(`
    <div class="modal-head">
      <div><h3 class="modal-title">${esc(it.n)}</h3>
        <div class="modal-sub">${['아사히 세이키',...state.drivePath].join(' / ')} · ${it.t} · ${it.s} · ${it.d} · ${it.by}</div></div>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${body}
      <div class="form-grid" style="margin-top:14px">
        <div class="f"><label>파일명</label><input value="${esc(it.n)}"></div>
        <div class="f"><label>연동 설비</label><select><option>연결 없음</option>${EQUIP.map(e=>`<option ${e.cat==='asahi'?'':''}>${e.model}</option>`).join('')}</select></div>
        <div class="f"><label>등록일 / 등록자</label><input value="${it.d} · ${it.by}" readonly></div>
      </div>
      <div class="f" style="margin-top:12px"><label>파일 메모</label>
        <textarea rows="2" placeholder="이 파일에 대한 메모 (예: 최신본, 구버전 대체 등)"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" onclick="toast('목업 — 삭제되지 않습니다')">삭제</button>
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" onclick="toast('목업 — 다운로드되지 않습니다')">다운로드</button>
    </div>`, 'wide');
}

/* ══════════════════════════════════════════════════════════
   7. 회계 관리 (대표자 전용 · 소규모 ERP)
   ══════════════════════════════════════════════════════════ */
const ACCOUNT_DASH = {
  '2025':{income:1026000000,buy:749000000,cost:98400000,profit:178600000},
  '2026':{income:711000000,buy:522000000,cost:75100000,profit:113900000},
  '2027':{income:0,buy:0,cost:0,profit:0},
};
const ACCOUNT_DATA = {
  cash:[
    ['일자','구분','내용','입금','출금','잔액','비고'],
    ['2026-09-02','입금','대성정밀 계약금','30000000','','30000000','수기 입력'],
    ['2026-09-05','출금','운송비','','4200000','25800000','수기 입력'],
    ['2026-09-09','출금','정비비','','1800000','24000000','수기 입력'],
  ],
  daily:[
    ['일자','매출','매입','비용','일별 손익','메모'],
    ['2026-09-02','30000000','0','0','30000000','수기 입력 예시'],
    ['2026-09-05','0','0','4200000','-4200000','월별 손익과 자동 연동하지 않음'],
    ['2026-09-09','0','0','1800000','-1800000',''],
  ],
  monthly:[
    ['월','매출','매입','비용','월별 손익','비고'],
    ['2026-07','132000000','96000000','12900000','23100000','수기 입력 예시'],
    ['2026-08','93000000','64000000','8500000','20500000','수기 입력 예시'],
    ['2026-09','30000000','0','6000000','24000000','일별 손익과 자동 연동하지 않음'],
  ]
};

function accountTable(view){
  const rows = ACCOUNT_DATA[view] || [];
  if(!rows.length) return '';
  return `<div class="card"><div class="tbl-wrap"><table class="tbl account-edit">
    <thead><tr>${rows[0].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(1).map((r,ri)=>`<tr>${r.map((v,ci)=>`<td contenteditable="true" data-ar="${ri+1}" data-ac="${ci}">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></div>`;
}

function pageAccount(){
  if(state.role!=='admin'){
    return `<div class="card"><div class="denied"><div class="lk">🔒</div>
      <h3>대표자 전용 페이지입니다</h3>
      <p>회계 관리는 대표자 계정만 열람할 수 있습니다.<br>상단 우측에서 <b>대표자</b>로 전환하면 화면을 확인할 수 있습니다. (목업 시연용)</p></div></div>`;
  }
  const d = ACCOUNT_DASH[state.sheetYear] || ACCOUNT_DASH['2026'];
  const names={dashboard:'회계 대시보드',cash:'금전출납부',daily:'일별 손익',monthly:'월별 손익'};
  let body='';
  if(state.accountView==='dashboard'){
    body = `<div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="k-label">연도 누적 매출</div><div class="k-value">${만(d.income)}<span class="unit">만원</span></div></div>
      <div class="kpi"><div class="k-label">연도 누적 매입</div><div class="k-value">${만(d.buy)}<span class="unit">만원</span></div></div>
      <div class="kpi"><div class="k-label">연도 누적 비용</div><div class="k-value">${만(d.cost)}<span class="unit">만원</span></div></div>
      <div class="kpi"><div class="k-label">연도 누적 손익</div><div class="k-value" style="color:var(--ok)">${만(d.profit)}<span class="unit">만원</span></div></div>
    </div>
    <div class="card"><div class="card-body">
      <div class="lock-note" style="margin:0"><span>ℹ</span><div>이 화면은 <b>연도별 누적 합계</b>를 보는 대표자용 대시보드입니다. 전년도 탭으로 이동해 과거 자료를 조회할 수 있습니다. 실제 숫자는 시연용 더미입니다.</div></div>
    </div></div>`;
  } else {
    body = `${accountTable(state.accountView)}
      <div class="dl-note" style="margin-top:12px">ℹ <b>대표 수기 입력</b> 기준입니다. 일별 손익과 월별 손익은 <b>자동 연동하지 않습니다</b>. 필요한 계산은 단순 사칙연산 수준의 보조 기능으로 제한합니다.</div>`;
  }

  return `<div class="page-head">
    <div><h1 class="page-title">회계 관리 <span class="badge b-violet" style="vertical-align:middle">대표자 전용</span></h1>
      <div class="page-sub">소규모 ERP · 공유 Excel 3종 양식 기준 · 대표 수기 입력 · 일/월 자동 연동 제외</div></div>
    <div class="actions"><button class="btn" onclick="toast('공유된 회계 Excel 3종 양식을 기준으로 구현합니다')">Excel 3종 기준</button></div>
  </div>
  <div class="lock-note"><span>🔒</span><div><b>대표자만 접근</b>합니다. 항목 추가·삭제는 가능하되 Excel 전체 함수 엔진이 아니라 수기 입력 + 단순 계산 중심으로 구현합니다.</div></div>
  <div class="tabs" style="margin-bottom:12px">
    ${Object.entries(names).map(([k,n])=>`<button class="tab ${state.accountView===k?'on':''}" data-av="${k}">${n}</button>`).join('')}
  </div>
  <div class="tabs" style="margin-bottom:14px">
    ${['2025','2026','2027'].map(y=>`<button class="tab ${state.sheetYear===y?'on':''}" data-year="${y}">${y}년</button>`).join('')}
  </div>
  ${body}`;
}

function bindAccount(){
  $$('.tab[data-av]').forEach(b=>b.onclick=()=>{ state.accountView=b.dataset.av; render(); });
  $$('.tab[data-year]').forEach(b=>b.onclick=()=>{ state.sheetYear=b.dataset.year; render(); });
  $$('.account-edit td[contenteditable]').forEach(td=>td.onblur=()=>{
    const rows=ACCOUNT_DATA[state.accountView];
    if(rows && rows[+td.dataset.ar]) rows[+td.dataset.ar][+td.dataset.ac]=td.textContent.trim();
    toast('수기 입력 값이 저장되었습니다 (목업)');
  });
}

/* ══════════════════════════════════════════════════════════
   8. 캘린더
   ══════════════════════════════════════════════════════════ */
function pageCalendar(){
  const EVENTS = {
    3:[['선적 · AP-450','#6b4fbb']], 7:[['통관 예정','#0e7490']],
    12:[['대성정밀 방문','#1b4f9c']], 18:[['창고 입고 · NC1-200D','#0f8a53']],
    20:[['판매 확정 · 대성정밀','#0f8a53']], 23:[['한신금속 현장 실사','#b5730a']],
    24:[['영업 미팅 · 똑똑한개발자','#1b4f9c']], 28:[['9월 선적 준비','#c1362f']],
  };
  const first = new Date(2026,7,1).getDay();
  let cells = '';
  for(let i=0;i<first;i++) cells += `<div class="dc dim"></div>`;
  for(let d=1; d<=31; d++){
    const ev = (EVENTS[d]||[]).map(([t,c])=>`<div class="ev" style="background:${c}1a;color:${c}">${t}</div>`).join('');
    cells += `<div class="dc ${d===24?'today':''}"><div class="dn">${d}</div>${ev}</div>`;
  }
  return `
  <div class="page-head">
    <div><h1 class="page-title">캘린더</h1><div class="page-sub">선적 · 통관 · 방문 일정 통합 관리</div></div>
    <div class="actions"><div class="seg"><button>◀</button><button class="on">2026년 8월</button><button>▶</button></div>
      <button class="btn primary" onclick="toast('목업 — 일정 등록은 시연되지 않습니다')">＋ 일정 등록</button></div>
  </div>
  <div class="card"><div class="card-body">
    <div class="cal">${['일','월','화','수','목','금','토'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells}</div>
  </div></div>`;
}

function pageNewCat(){
  return `<div class="card"><div class="empty">
    <div class="ic">＋</div><h3>아직 설정되지 않은 카테고리입니다</h3>
    <p style="font-size:13px">세정기 등 신규 사업 추가 시 중고 설비 / 아사히 세이키와 <b>동일한 폴더 구조</b>로 확장됩니다.<br>
    카테고리 추가·삭제는 상단 내비게이션에서 자유롭게 가능합니다.</p>
    <button class="btn primary" style="margin-top:14px" onclick="document.getElementById('catAdd').click()">이 카테고리 설정하기</button>
  </div></div>`;
}

/* ══════════════════════════════════════════════════════════
   렌더러
   ══════════════════════════════════════════════════════════ */
function render(){
  renderCats(); renderSide();
  const m = $('#main');

  if(state.cat==='calendar'){ m.innerHTML = pageCalendar(); window.scrollTo(0,0); return; }
  if(state.cat==='asahi'){ state.page='goods'; m.innerHTML = pageDrive(); bindDrive(); return; }
  if(state.cat==='new' && state.page!=='account' && state.page!=='customer'){ m.innerHTML = pageNewCat(); return; }

  switch(state.page){
    case 'dash':     m.innerHTML = pageDash(); break;
    case 'goods':
      if(state.cat==='asahi'){ m.innerHTML = pageDrive(); bindDrive(); }
      else m.innerHTML = pageGoods();
      break;
    case 'quote':    m.innerHTML = pageQuote(); break;
    case 'sales':    m.innerHTML = pageSales(); break;
    case 'customer': m.innerHTML = pageCustomer(); bindCustomer(); break;
    case 'files':    m.innerHTML = pageFiles(); bindFiles(); break;
    case 'account':  m.innerHTML = pageAccount(); if(state.role==='admin') bindAccount(); break;
    default:         m.innerHTML = pageDash();
  }

  // 공통 바인딩
  $$('[data-eq]').forEach(el=> el.onclick = ()=> openEquip(el.dataset.eq));
  $$('[data-deal]').forEach(el=> el.onclick = ()=> openDeal(el.dataset.deal));
  $$('[data-go]').forEach(el=> el.onclick = ()=>{ state.page = el.dataset.go; render(); });
  $$('[data-view]').forEach(el=> el.onclick = ()=>{ state.goodsView = el.dataset.view; render(); });
  $$('[data-stage]').forEach(el=> el.onclick = ()=>{ state.goodsFilter = el.dataset.stage; render(); });
  if($('#statBtn')) $('#statBtn').onclick = openStats;
  if($('#newDeal')) $('#newDeal').onclick = ()=> openModal(`
    <div class="modal-head"><div><h3 class="modal-title">영업 건 생성</h3>
      <div class="modal-sub">복수의 설비를 하나의 영업 건으로 묶어 관리합니다</div></div>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="f"><label>영업 건명 *</label><input placeholder="예: 대성정밀 프레스 2대 건"></div>
      <div class="f"><label>고객사 *</label><select>${[...new Set(CUSTOMERS.map(c=>c.co))].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="f"><label>담당자</label><select><option>서장원</option><option>김담당</option></select></div>
    </div>
    <div class="f" style="margin-top:12px"><label>최초 메모</label><textarea rows="3" placeholder="상담 내용, 요구 조건 등"></textarea></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="closeModal();toast('목업 — 실제로 생성되지 않습니다')">생성</button></div>`,'narrow');
}

function bindFiles(){
  $('#fAll').onchange = e=> $$('.fchk').forEach(c=> c.checked = e.target.checked);
  $('#bulkDl').onclick = ()=>{
    const n = $$('.fchk').filter(c=>c.checked).length;
    if(!n) return toast('다운로드할 파일을 선택해 주세요');
    toast(`${n}개 파일 압축 다운로드를 시작합니다 (목업 · 최대 30개 제한)`);
  };
}

render();
